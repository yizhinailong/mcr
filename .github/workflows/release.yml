name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows CI
    uses: ./.github/workflows/windows-ci.yml

  linux:
    name: Linux CI
    uses: ./.github/workflows/linux-ci.yml

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: [windows, linux]
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
              Write-Output "Release $env:RELEASE_TAG already exists; nothing to create"
              exit 0
          }

          $version = $env:RELEASE_TAG.Substring(1)
          $releaseArgs = @(
              'release', 'create', $env:RELEASE_TAG,
              '--verify-tag', '--generate-notes',
              '--title', "mcr $version"
          )
          if (($version -split '\+', 2)[0].Contains('-')) {
              $releaseArgs += '--prerelease'
          }
          gh @releaseArgs
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to publish release $env:RELEASE_TAG"
          }
