name: Windows and Linux CI

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.platform }} x64 build and test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-2025
            shell: pwsh
          - platform: Linux
            os: ubuntu-24.04
            shell: bash
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Set up Python for TOML parsing
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        shell: python
        run: |
          import os
          import tomllib

          with open("mcpp.toml", "rb") as manifest:
              version = tomllib.load(manifest)["package"]["version"]
          expected = f"v{version}"
          actual = os.environ["GITHUB_REF_NAME"]
          if actual != expected:
              raise ValueError(f"Tag {actual} must match package version {expected}")
          print(f"Verified {actual} matches [package].version.")

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: amd64

      - name: Install mcpp on Windows
        if: runner.os == 'Windows'
        run: |
          $ErrorActionPreference = 'Stop'
          $mcppVersion = '2026.9.11.1'
          $mcppSha256 = 'ca46b1dadf674b4e8aa183f84832631119d36eae6807f1996b9f940c4c890ad0'
          $archiveName = "mcpp-$mcppVersion-windows-x86_64"
          $archivePath = Join-Path $env:RUNNER_TEMP "$archiveName.zip"
          $installRoot = Join-Path $env:RUNNER_TEMP $archiveName

          Invoke-WebRequest -Uri "https://github.com/mcpp-community/mcpp/releases/download/v$mcppVersion/$archiveName.zip" -OutFile $archivePath
          if ((Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash -ne $mcppSha256) {
              throw 'The mcpp release archive checksum does not match.'
          }
          Expand-Archive -LiteralPath $archivePath -DestinationPath $env:RUNNER_TEMP -Force

          $mcppBin = Join-Path $installRoot 'bin'
          $mcppExe = Join-Path $mcppBin 'mcpp.exe'
          if (!(Test-Path -LiteralPath $mcppExe)) {
              throw 'The mcpp release archive does not contain bin/mcpp.exe.'
          }
          # Keep the bundled registry/bin/xlings.exe in this isolated MCPP_HOME.
          $env:MCPP_HOME = $installRoot
          $env:PATH = "$mcppBin;$env:PATH"
          "MCPP_HOME=$installRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $mcppBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $mcppExe --version
          if ($LASTEXITCODE -ne 0) {
              throw "mcpp --version failed with exit code $LASTEXITCODE."
          }

      - name: Install mcpp on Linux
        if: runner.os == 'Linux'
        run: |
          mcpp_version='2026.9.11.1'
          mcpp_sha256='efcb0844a31b5e70a2157c59a91073d42886bf104f0062815d38ffaab7fdae05'
          archive_name="mcpp-$mcpp_version-linux-x86_64"
          archive_path="$RUNNER_TEMP/$archive_name.tar.gz"
          install_root="$RUNNER_TEMP/$archive_name"

          curl --fail --location --retry 3 \
            "https://github.com/mcpp-community/mcpp/releases/download/v$mcpp_version/$archive_name.tar.gz" \
            --output "$archive_path"
          printf '%s  %s\n' "$mcpp_sha256" "$archive_path" | sha256sum --check
          tar -xzf "$archive_path" -C "$RUNNER_TEMP"
          test -x "$install_root/bin/mcpp"

          # Keep the bundled registry/bin/xlings in this isolated MCPP_HOME.
          export MCPP_HOME="$install_root"
          export PATH="$install_root/bin:$PATH"
          printf 'MCPP_HOME=%s\n' "$install_root" >> "$GITHUB_ENV"
          printf '%s\n' "$install_root/bin" >> "$GITHUB_PATH"
          "$install_root/bin/mcpp" --version

      - name: Install LLVM toolchain
        run: mcpp toolchain install llvm 22.1.8

      - name: Select LLVM toolchain
        run: mcpp toolchain default llvm@22.1.8

      - name: Build
        run: mcpp build

      - name: Test
        run: mcpp test

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: test
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
              Write-Output "Release $env:RELEASE_TAG already exists; nothing to create"
              exit 0
          }

          $version = $env:RELEASE_TAG.Substring(1)
          $releaseArgs = @(
              'release', 'create', $env:RELEASE_TAG,
              '--verify-tag', '--generate-notes',
              '--title', "mcr $version"
          )
          if (($version -split '\+', 2)[0].Contains('-')) {
              $releaseArgs += '--prerelease'
          }
          gh @releaseArgs
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to publish release $env:RELEASE_TAG"
          }
